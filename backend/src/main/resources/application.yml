server:
  port: 8080

spring:
  application:
    name: smart-retail-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/smart_retail_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
